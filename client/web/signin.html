<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AthanBox Client · Sign in</title>
<style>
:root{--bg:#0d4a3f;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.18);--muted:#cfe3dc;--accent:#f3e2b4;--bad:#ffb4a8}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font:400 18px/1.45 system-ui,"DejaVu Sans",sans-serif}
main{max-width:520px;margin:0 auto;padding:48px 20px 60px}
h1{font-size:28px;margin:0 0 6px}
p{margin:0 0 16px;color:var(--muted)}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px}
label{display:block;font-weight:600;margin:0 0 8px}
input{width:100%;box-sizing:border-box;font:700 34px/1 system-ui,sans-serif;letter-spacing:8px;text-align:center;padding:14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{font:600 18px system-ui,sans-serif;padding:12px 20px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
button.main{background:var(--accent);color:#14312a;border-color:var(--accent);flex:1}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:14px;min-height:1.4em}
.msg.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>Screen settings</h1>
  <p>To change this TV screen's settings from here, type the code that's now showing on its TV. You only need to do this once on this phone or computer.</p>
  <section>
    <label for="code">The code on the TV</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000" autofocus>
    <div class="row">
      <button class="main" id="go">Open the settings</button>
      <button id="again">Show the code again</button>
    </div>
    <div class="msg" id="msg"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const msg = (t, k) => { $("#msg").textContent = t || ""; $("#msg").className = "msg " + (k || ""); };
async function post(path, body){
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  if (r.status === 403) return {ok: false, error: await r.text()};
  return r.json();
}
async function showCode(){
  try{
    const r = await post("/client/api/signin/code");
    msg(r.ok ? `The code shows on the TV for ${r.minutes} minutes.` : r.error, r.ok ? "" : "bad");
  }catch(e){ msg("This screen isn't answering. Is it switched on?", "bad"); }
}
async function go(){
  const code = $("#code").value.replace(/\D/g, "");
  if (code.length !== 6) return msg("The code has 6 digits.", "bad");
  $("#go").disabled = true;
  try{
    const r = await post("/client/api/signin", {code});
    if (r.ok) return location.reload();
    msg(r.error, "bad");
    if (!r.expired) $("#code").select();
  }catch(e){ msg("This screen isn't answering. Is it switched on?", "bad"); }
  finally{ $("#go").disabled = false; }
}
$("#go").onclick = go;
$("#code").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
$("#again").onclick = () => { $("#code").value = ""; showCode(); };
showCode();
</script>
</body>
</html>
