<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AthanBox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23146356'/%3E%3Cpath d='M19 8a8 8 0 1 0 5 14 9 9 0 1 1-5-14z' fill='%23f4e3b5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f2ea; --panel:#fffdf8; --panel-2:#f0ebdf; --ink:#1d2622; --muted:#5f6b65; --line:#e1d9c7;
  --brand:#146356; --brand-2:#0e4a40; --brand-ink:#fff; --accent:#b7832f; --accent-soft:#f6ead2;
  --ok:#1f7a4d; --warn:#9a6200; --warn-bg:#fff3d6; --bad:#b4372f; --bad-bg:#fde8e6;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 16px rgba(40,30,10,.06); --r:14px;
}
:root[data-theme=dark]{
  --bg:#111715; --panel:#18201d; --panel-2:#1f2925; --ink:#e7ece9; --muted:#9aa8a1; --line:#2b3632;
  --brand:#2f9c86; --brand-2:#3db39b; --brand-ink:#04120e; --accent:#d9a74f; --accent-soft:#2c261a;
  --ok:#5cc28e; --warn:#e3b04f; --warn-bg:#2d2615; --bad:#ef7d74; --bad-bg:#341b19; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--brand)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo svg{flex:none}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
nav button:hover{background:var(--panel-2);color:var(--ink)}
nav button.active{background:var(--brand);color:var(--brand-ink)}
nav button svg{width:18px;height:18px;flex:none}
nav .spacer{flex:1}
.status-mini{padding:12px;border-radius:10px;background:var(--panel-2);font-size:13px;color:var(--muted)}
.status-mini b{color:var(--ink);display:block;font-size:14px}
main{padding:28px 34px 110px;max-width:1080px;width:100%}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.2px}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:-2px}
input[type=text],input[type=number],input[type=password],input[type=time],input[type=date],input[type=search],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none}
textarea{min-height:84px;resize:vertical;font-family:Consolas,ui-monospace,monospace;font-size:13.5px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 11px;font-size:13.5px}
.btn.tiny{padding:3px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--panel-2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.brand{background:var(--brand);color:var(--brand-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);margin-bottom:12px;font-weight:500}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner svg{flex:none;width:18px;height:18px;margin-top:2px}
/* hero */
.hero{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;border:0;position:relative;overflow:hidden;padding:26px 28px}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,var(--hero-a,#123d35),var(--hero-b,#18584b))}
.hero .pattern{position:absolute;right:-40px;top:-40px;opacity:.12;width:300px;height:300px}
.hero .eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;opacity:.85;font-weight:600}
.hero .big{font-size:44px;font-weight:700;line-height:1.1;margin:6px 0 2px;letter-spacing:-.5px}
.hero .when{font-size:17px;opacity:.95}
.hero .countdown{font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:.5px}
.hero .meta{opacity:.8;font-size:13.5px;margin-top:14px}
.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.24)}
.hero-grid{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;position:relative}
.playing{display:flex;align-items:center;gap:12px}
.bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.bars i{width:4px;background:#fff;border-radius:2px;animation:b 1s infinite ease-in-out}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes b{0%,100%{height:5px}50%{height:22px}}
/* prayer cards */
.prayers{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.pcard .name{font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.pcard .time{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.pcard.next{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 30%,transparent)}
.pcard.passed .time,.pcard.played .time{opacity:.55}
.pcard.sunrise{background:var(--panel-2);box-shadow:none}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);min-height:24px}
/* switch */
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span:before{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:0}
.toggle-row .t{font-weight:600}.toggle-row .d{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
table.tight td{padding:4px 10px;font-size:13.5px}
tr:last-child td{border-bottom:0}
.log{font-family:Consolas,ui-monospace,monospace;font-size:12.5px;background:var(--panel-2);border-radius:10px;padding:10px 12px;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .WARNING{color:var(--warn)}.log .ERROR{color:var(--bad)}
.log .ts{color:var(--muted)}
.list-item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.rec{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .name{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .dur{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rec .btn svg{width:12px;height:12px}
.recplay{all:unset;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--accent-soft);color:var(--accent)}
.recplay svg{width:12px;height:12px}
.recplay:focus-visible{outline:2px solid var(--brand)}
@media (max-width:560px){.rec .long,.rec .dur{display:none}}
.list-item .grow{flex:1;min-width:0}
.list-item .title{font-weight:600}
.list-item .detail{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-box{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.icon-box svg{width:20px;height:20px}
.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.choice label{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:block}
.choice label:hover{border-color:var(--brand)}
.choice input{display:none}
.choice input:checked+div{color:var(--ink)}
.choice label:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,transparent)}
.choice .ct{font-weight:700;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.choice .cd{font-size:13px;color:var(--muted)}
.choice label:last-child:nth-child(odd){grid-column:1 / -1}
.acct{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.acct .grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.acct .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){ .acct .grid4{grid-template-columns:1fr 1fr} }
.acct .field{margin:0}
.server-box{display:flex;flex-wrap:wrap;gap:8px 28px;padding:12px 16px;border-radius:12px;background:var(--accent-soft);margin-bottom:14px;font-size:14px}
.server-box b{font-family:Consolas,ui-monospace,monospace;font-size:15px}
@media (max-width:1100px){ .acct .grid5{grid-template-columns:1fr 1fr 1fr} }
@media (max-width:900px){ .acct .grid5{grid-template-columns:1fr 1fr} }
.seg{align-self:flex-start;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{padding:8px 14px;cursor:pointer;border-right:1px solid var(--line);font-weight:500}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink)}
.hero .seg label{border-color:rgba(255,255,255,.35)}
.hero .seg label:has(input:checked){background:#fff;color:var(--brand-2)}
details{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
summary{cursor:pointer;font-weight:600;color:var(--brand);margin-bottom:10px}
.results{border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.results button{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--panel-2)}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 20px;border-radius:14px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:20}
.savebar .btn{border-color:transparent}
.savebar .btn.ghost{background:transparent;color:var(--bg)}
.toast{position:fixed;right:20px;top:20px;padding:12px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:30;max-width:420px;font-weight:500}
.toast.bad{border-color:var(--bad);color:var(--bad)}
.toast.ok{border-color:var(--ok)}
.muted{color:var(--muted)}
.mono{font-family:Consolas,ui-monospace,monospace}
.kbd{font-family:Consolas,ui-monospace,monospace;background:var(--panel-2);padding:1px 6px;border-radius:5px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px}
.stopped{max-width:520px;margin:15vh auto;text-align:center}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50}
.overlay .card{max-width:420px;text-align:center;padding:30px}
/* AthanBox: settings lock */
.lock{position:fixed;inset:0;background:color-mix(in srgb,#0e4a40 82%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:16px}
.lock form{background:var(--panel);border-radius:20px;padding:30px 32px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lock .lockicon{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.lock h2{font-size:24px;margin:0 0 8px}
.lock p{color:var(--muted);margin:0 0 18px}
.lock .err{color:var(--bad);font-size:13.5px;margin:-6px 0 12px;min-height:1em}
.lock .actions{display:flex;justify-content:flex-end;gap:10px}
.lock .foot{font-size:13px;color:var(--muted);margin:18px 0 0}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- Display page and Appearance */
.dprev{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0d4a3f}
.dprev iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0;pointer-events:none}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.themes label{position:relative;display:flex;flex-direction:column;gap:8px;padding:10px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600;font-size:14px}
.themes label:hover{border-color:var(--brand)}
.themes label:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.themes label:has(input:focus-visible),.accents label:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.themes input,.accents input{position:absolute;opacity:0;pointer-events:none}
.swatch{height:56px;border-radius:8px;display:flex;align-items:flex-end;gap:5px;padding:9px;border:1px solid rgba(0,0,0,.08)}
.swatch i{height:9px;border-radius:5px;flex:1;opacity:.35}
.swatch i:first-child{flex:2;opacity:1}
.accents{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.accents label{position:relative;width:34px;height:34px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.accents label:has(input:checked){box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ink)}
.accents .custom{background:conic-gradient(#e5484d,#f5d90a,#30a46c,#00a2c7,#3e63dd,#8e4ec6,#e5484d)}
input[type=color]{width:54px;height:36px;padding:3px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px}
.parts .toggle-row:nth-last-child(2):nth-child(odd){border-bottom:0}
input[type=range]{width:100%;max-width:420px}
.access-qr{display:flex;gap:18px;align-items:center;padding:14px;border-radius:12px;background:var(--panel-2);margin-top:10px}
.access-qr svg{width:120px;height:120px;border-radius:8px;flex:none;background:#fff}
.tvrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tvrow:first-of-type{border-top:0}
.tvrow svg{width:26px;height:26px;flex:none;color:var(--muted)}
.tvrow .t{font-weight:700}
.tvrow .d{font-size:13px;color:var(--muted)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st}
ol.steps>li{counter-increment:st;position:relative;padding:12px 0 12px 44px;border-top:1px solid var(--line);line-height:1.5}
ol.steps>li:first-child{border-top:0;padding-top:4px}
ol.steps>li::before{content:counter(st);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
ol.steps>li:first-child::before{top:2px}
ol.steps b{font-weight:700}
ol.steps .muted{font-size:13px}
@media (max-width:900px){ .parts{grid-template-columns:1fr} .seg{flex-wrap:wrap} }
@media (max-width:900px){
  .layout{grid-template-columns:1fr} nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
  nav .spacer,.status-mini{display:none} .logo{padding:6px 10px}
  main{padding:20px 16px 110px} .prayers{grid-template-columns:repeat(3,1fr)} .grid2,.grid3,.choice{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout" id="layout">
  <nav>
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="var(--brand)"/><path d="M19 8a8 8 0 1 0 5 14 9 9 0 1 1-5-14z" fill="#f4e3b5"/></svg>
      AthanBox
    </div>
    <button data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
    <button data-page="times"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Prayer times</button>
    <button data-page="audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>Azan sound</button>
    <button data-page="phones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 6h6M12 18h.01"/></svg>Phones</button>
    <button data-page="ramadan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Ramadan</button>
    <button data-page="display" title="Theme and layout of the prayer-times screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>Display</button>
    <button data-page="tv" title="Show the prayer times on a TV and play the azan through it, from an iPad, an Android device or a smart TV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M7 21h10M9.5 9.5v5l4-2.5z"/></svg>TV app</button>

<div id="overlay" class="overlay" hidden><div class="card"><div class="spinner"></div><h2 id="ov-title">Updating…</h2><p class="muted" id="ov-text">Please keep this page open.</p></div></div>

<script>
"use strict";
// ---------------------------------------------------------------- utilities
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const PRAYERS = ["fajr","dhuhr","asr","maghrib","isha"];
const TITLE = {fajr:"Fajr",sunrise:"Sunrise",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha",jumuah:"Jumu'ah"};
const ICON = {
  signin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>',
  broadcast:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg>',
  server:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>',
  deskphone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h3v16H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 6h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9"/><path d="M12 9h5v3h-5zM12 15h.01M15 15h.01M18 15h.01"/></svg>',
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  screen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
};
const pattern = '<svg class="pattern" viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-width="1.2"><rect x="20" y="20" width="60" height="60"/><rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="18"/><circle cx="50" cy="50" r="42"/></g></svg>';

function getPath(o, p){ return p.split(".").reduce((a,k)=>a==null?undefined:a[k], o); }
function setPath(o, p, v){ const ks=p.split("."); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null||typeof a[k]!=="object") a[k]={}; a=a[k]; }); if(v===undefined) delete a[ks.at(-1)]; else a[ks.at(-1)]=v; }

async function api(path, body, raw){
  const opt = {method: body===undefined ? "GET" : "POST", headers:{"X-Azan-Panel":"1"}};
  if(body!==undefined){
    if(raw){ opt.body = body; opt.headers["Content-Type"]="application/octet-stream"; }
    else { opt.body = JSON.stringify(body); opt.headers["Content-Type"]="application/json"; }
  }
  let r;
  try { r = await fetch(path, opt); } catch(e){ throw new Error(SESSION.box ? "Can't reach AthanBox. Check it's switched on and connected." : "AthanBox isn't running. Double-click 'Azan SIP' to start it."); }
  const j = await r.json().catch(()=>({ok:false,error:"Unexpected reply"}));
  if(r.status===401 && j.login && !path.startsWith("/api/log")){ await unlock(); return api(path, body, raw); }  // session ended: ask again, then retry
  if(!r.ok || j.ok===false) throw new Error(j.error || ("Error "+r.status));
  return j;
}

// ---------------------------------------------------------------- AthanBox: password lock
let SESSION = {box:false, logged_in:true}, lockWaiters = [];
function unlock(){
  return new Promise(res=>{
    lockWaiters.push(res);
    if(!$("#lock").hidden) return;
    $("#lockerr").textContent=""; $("#lockpw").value=""; $("#lock").hidden=false; setTimeout(()=>$("#lockpw").focus(), 50);
  });
}
$("#lockform").addEventListener("submit", async e=>{
  e.preventDefault();
  const b=$("#lockbtn"); b.disabled=true; $("#lockerr").textContent="";
  try{
    await api("/api/login", {password: $("#lockpw").value});
    SESSION.logged_in=true; $("#lock").hidden=true;
    const w=lockWaiters; lockWaiters=[]; w.forEach(f=>f());
  }catch(err){ $("#lockerr").textContent=err.message; $("#lockpw").select(); }
  b.disabled=false;
});
async function loadSession(){
  try{ SESSION = await api("/api/session"); }catch(e){ return; }
  if(SESSION.panel) applyPanelLook(SESSION.panel);  // the panel's own colours, even behind the lock
  const code = new URLSearchParams(location.search).get("setup");
  if(code){  // scanned the QR code on AthanBox's screen during first-time setup
    history.replaceState(null, "", location.pathname + location.hash);
    if(SESSION.box && !SESSION.logged_in){
      try{ await api("/api/login", {setup_code: code}); SESSION.logged_in=true; }catch(e){ toast(e.message, "bad"); }
    }
  }
  if(SESSION.box && !SESSION.logged_in) await unlock();
  if(SESSION.box){ $("#tvbtn").hidden = false; $("#secbtn").hidden = false; }
  if(SESSION.box && SESSION.local) kioskReturn();
}
// The prayer-times screen: in place on AthanBox's own screen, in a new tab on a phone or PC
function openScreen(path){ if(SESSION.box && SESSION.local) location.assign(path); else window.open(path, "_blank"); }
// On AthanBox's own screen: a way back to the prayer times, and back there by itself after 5 idle
// minutes with nothing unsaved (the prayer-times screen locks the settings again).
function kioskReturn(){
  let last = Date.now();
  ["pointerdown","keydown","wheel"].forEach(ev=>addEventListener(ev, ()=>last=Date.now(), {passive:true}));
  setInterval(()=>{ if(Date.now()-last > 300000 && !isDirty()) location.assign("/display"); }, 15000);
}
async function changePassword(){
  const cur=$("#pw-cur"), a=$("#pw-new"), b=$("#pw-again");
  if(a.value.length<8) return toast("The new password must be at least 8 characters","bad");
  if(a.value!==b.value) return toast("The new passwords don't match","bad");
  await act(async()=>{ await api("/api/password",{current:cur?cur.value:"", new:a.value}); SESSION.custom_password=true; [cur,a,b].forEach(x=>x&&(x.value="")); }, "Password changed. Other devices have been signed out.");
}
// The step-by-step setup guide: during first-time setup (instead of setting up here), or again later
async function openGuide(again){
  if(again) return location.assign("/setup?again=1");
  await act(async()=>{ await api("/api/setup/state", {client:"panel", state:null}); location.assign("/setup"); });
}
async function signOut(){ try{ await api("/api/logout",{}); }catch(e){} location.reload(); }
async function factoryReset(){
  const t = prompt("This removes all settings, recordings and your own password. AthanBox goes back to first-time setup and the password on the sticker works again.\n\nType RESET to confirm:");
  if(t===null) return;
  await act(async()=>{ await api("/api/factory-reset",{confirm:t.trim().toUpperCase()}); location.reload(); });
}
function boxCardHTML(){
  if(!SESSION.box) return "";
  return `<div class="card"><h2>Password and reset</h2>
    <p class="muted" style="margin-top:-6px">Anyone on your network can open this page at <b>http://azan.local</b>. Viewing the prayer times is open; changing settings needs the password.
    ${SESSION.custom_password?"You're using your own password.":"You're using the password on the sticker."}</p>
    <div class="grid3">
      <div class="field"><label>Current password</label><input type="password" id="pw-cur" autocomplete="current-password"></div>
      <div class="field"><label>New password</label><input type="password" id="pw-new" autocomplete="new-password"><div class="hint">At least 8 characters.</div></div>
      <div class="field"><label>Type it again</label><input type="password" id="pw-again" autocomplete="new-password"></div>
    </div>
    <div class="row"><button class="btn primary" onclick="changePassword()">Change password</button><button class="btn" onclick="signOut()">Sign out</button></div>
    ${S && S.configured!==false?`<div class="toggle-row" style="margin-top:14px"><div><div class="t">Setup guide</div><div class="d">Go through the setup steps again, starting from your current settings.</div></div>
      <button class="btn" onclick="openGuide(true)">Run the setup guide again</button></div>`:""}
    <div class="toggle-row" style="margin-top:14px"><div><div class="t">Factory reset</div><div class="d">Removes all settings, recordings and your own password. The sticker password works again.</div></div>
      <button class="btn danger" onclick="factoryReset()">Factory reset…</button></div>
  </div>`;
}
let toastTimer;
function toast(msg, kind="ok"){ const t=$("#toast"); t.textContent=msg; t.className="toast "+kind; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, kind==="bad"?7000:3500); }
async function act(fn, okMsg){ try{ const r=await fn(); if(okMsg) toast(okMsg); return r; }catch(e){ toast(e.message,"bad"); } }
function fmtDur(s){ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return h ? `${h} h ${String(m).padStart(2,"0")} min` : m ? `${m} min ${String(x).padStart(2,"0")} s` : `${x} s`; }
// ---- appearance of this control panel: light/dark and a colour, from Settings → Appearance
const ACCENTS = {green:["Green","#146356"], blue:["Blue","#1f5fa8"], navy:["Navy","#23395d"], maroon:["Maroon","#7a2335"], purple:["Purple","#5b3f8c"], brown:["Brown","#8a5a14"]};
let PANEL_LOOK = (()=>{ try{ return JSON.parse(localStorage.getItem("azanPanelLook")) || {}; }catch(e){ return {}; } })();
function lum(hex){
  const n = parseInt(String(hex).slice(1), 16) || 0;
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
function themeSync(){
  const m = PANEL_LOOK.mode;
  document.documentElement.dataset.theme = m === "light" ? "light" : m === "dark" ? "dark" : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyPanelLook(p){
  PANEL_LOOK = Object.assign({mode:"auto", accent:"green", color:"#146356"}, p || {});
  try{ localStorage.setItem("azanPanelLook", JSON.stringify(PANEL_LOOK)); }catch(e){}
  themeSync();
  const r = document.documentElement.style;
  ["--brand","--brand-2","--brand-ink","--hero-a","--hero-b"].forEach(n => r.removeProperty(n));
  if(PANEL_LOOK.accent === "green") return;
  const c = PANEL_LOOK.accent === "custom" ? PANEL_LOOK.color : (ACCENTS[PANEL_LOOK.accent] || ACCENTS.green)[1];
  const dark = document.documentElement.dataset.theme === "dark";
  r.setProperty("--brand", dark ? `color-mix(in srgb,${c} 62%,#fff)` : c);
  r.setProperty("--brand-2", dark ? `color-mix(in srgb,${c} 48%,#fff)` : `color-mix(in srgb,${c} 80%,#000)`);
  r.setProperty("--brand-ink", dark ? "#0b0f0e" : (lum(c) > .45 ? "#111" : "#fff"));
  r.setProperty("--hero-a", `color-mix(in srgb,${c} 62%,#000)`); r.setProperty("--hero-b", `color-mix(in srgb,${c} 85%,#000)`);
}
applyPanelLook(PANEL_LOOK);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyPanelLook(PANEL_LOOK));

// ---------------------------------------------------------------- state
let S = null, stateAt = 0, CFG = null, SAVED = "", META = null, page = location.hash.slice(1) || "overview";
let editing = null, previewTimer = null, previewData = null, logSeen = 0, offline = false, restartingUI = false;

async function loadConfig(){
  const r = await api("/api/config");
  CFG = r.config; META = r.meta; SAVED = JSON.stringify(CFG);
  normalize(CFG); SAVED = JSON.stringify(CFG);
  dirty(); applyPanelLook(CFG.panel);
}
function normalize(c){
  for(const k of ["general","location","calculation","offsets","prayers","audio","network","live","display","panel","ramadan"]) c[k] = c[k] || {};
  c.targets = c.targets || [];
  c.prayers.enabled = c.prayers.enabled || PRAYERS.slice();
  c.prayers.skip_days = c.prayers.skip_days || [];
  if(c.location.timezone === undefined) c.location.timezone = "local";
}
function isDirty(){ return CFG && JSON.stringify(CFG) !== SAVED; }
function dirty(){ $("#savebar").hidden = !isDirty(); }
async function save(){
  const b=$("#savebtn"); b.disabled=true;
  try{ const r = await api("/api/config", {config: CFG}); CFG=r.config; normalize(CFG); SAVED=JSON.stringify(CFG); dirty(); toast("Saved - the new settings are active."); await poll(); render(); }
  catch(e){ toast(e.message,"bad"); }
  b.disabled=false;
}
function discard(){ CFG = JSON.parse(SAVED); editing=null; dirty(); applyPanelLook(CFG.panel); render(); schedulePreview(); }
// apply a change that the server already saved, without disturbing other unsaved edits
function applySaved(path, value){ const s=JSON.parse(SAVED); setPath(s,path,value); SAVED=JSON.stringify(s); setPath(CFG,path,clone(value)); dirty(); }

async function poll(){
  try{
    S = await api("/api/state"); stateAt = Date.now();
    if(offline){ offline=false; }
  }catch(e){
    if(!offline && !restartingUI){ offline=true; renderMini(); if(page==="overview") render(); }
    return;
  }
  try{
  renderMini();
  if(page==="overview") renderOverviewLive();
  if(page==="settings") renderLog();
  if(page==="phones" && CFG) refreshRegPills();
  if(page==="tv"){ const el=$("#tvlist"); if(el) el.innerHTML = tvListHTML(); }
  if(page==="security" && SEC && ++secTick % 3 === 0) loadSecurity().then(secLive);
  }catch(e){ console.error(e); }
}
setInterval(poll, 2000);
setInterval(()=>{ if(S && S.next){ const el=$("#countdown"); if(el) el.textContent=fmtDur(S.next.seconds-(Date.now()-stateAt)/1000); } const c=$("#clock"); if(c&&S&&S.clock){ /* server clock text refreshes every poll */ } }, 250);

function renderMini(){
  const m=$("#mini");
  if(offline||!S){ m.innerHTML="<b>Not running</b>Double-click Azan SIP to start it."; return; }
  if(S.playing){ m.innerHTML=`<b>▶ Playing</b>${esc(S.playing)}`; return; }
  m.innerHTML = S.running ? `<b><span style="color:var(--ok)">●</span> Automatic azan on</b>${S.next?esc((S.next.kind==="ramadan"?S.next.label+" ":TITLE[S.next.prayer]+" "+(S.next.kind==="reminder"?"reminder ":""))+"at "+S.next.time):""}`
                          : `<b><span style="color:var(--warn)">●</span> Paused</b>Azan will not play`;
}

// ---------------------------------------------------------------- binding
document.addEventListener("input", onField); document.addEventListener("change", onField);
function onField(e){
  const el = e.target; const path = el.dataset.path; if(!path) return;
  if(e.type==="input" && (el.type==="checkbox"||el.type==="radio"||el.tagName==="SELECT")) return;
  const root = path.startsWith("edit.") ? editing : CFG; const p = path.replace(/^edit\./,"");
  let v;
  const kind = el.dataset.kind || "text";
  if(kind==="num"){ v = el.value.trim()==="" ? undefined : Number(el.value); if(Number.isNaN(v)) return; }
  else if(kind==="int"){ v = el.value.trim()==="" ? 0 : parseInt(el.value,10); if(Number.isNaN(v)) return; }
  else if(kind==="bool"){ v = el.checked; }
  else if(kind==="member"){ const list=(getPath(root,p)||[]).filter(x=>x!==el.value); if(el.checked) list.push(el.value); v=list; }
  else if(kind==="hide"){ const list=(getPath(root,p)||[]).filter(x=>x!==el.value); if(!el.checked) list.push(el.value); v=list; }   // switch on = shown
  else { v = el.value; }
  setPath(root, p, v);
  if(root===CFG) dirty();
  if(root===CFG && (p.startsWith("display.") || p.startsWith("kids."))) postLook();
  if(root===CFG && p.startsWith("panel.")){ applyPanelLook(CFG.panel); const pc=$("#pcolor"); if(pc) pc.hidden = CFG.panel.accent!=="custom"; }
  if(el.dataset.preview!==undefined) schedulePreview();
  if(el.dataset.rerender!==undefined && e.type==="change") render();
}
const val = p => esc(getPath(CFG,p) ?? "");
const evl = p => esc(getPath(editing,p) ?? "");
function opt(v, label, cur){ return `<option value="${esc(v)}" ${String(cur??"")===String(v)?"selected":""}>${esc(label)}</option>`; }
function sw(path, checked, extra=""){ return `<label class="switch"><input type="checkbox" data-path="${path}" data-kind="bool" ${checked?"checked":""} ${extra}><span></span></label>`; }

// ---------------------------------------------------------------- pages
document.querySelectorAll("nav button[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
function go(p){ page=p; location.hash=p; editing=null; if(p==="security") SEC=null; render(); window.scrollTo(0,0); if(p==="times") schedulePreview(0); }
function render(){
  document.querySelectorAll("nav button[data-page]").forEach(b=>b.classList.toggle("active", b.dataset.page===page));
  if(!CFG){ $("#main").innerHTML = offline ? stoppedHTML() : '<p class="muted">Loading…</p>'; return; }
  ({overview:pageOverview, times:pageTimes, audio:pageAudio, phones:pagePhones, display:pageDisplay, tv:pageTV, ramadan:pageRamadan, security:pageSecurity, settings:pageSettings}[page]||pageOverview)();
}
function stoppedHTML(){ return `<div class="stopped card"><h1>AthanBox is not running</h1><p class="sub">The azan will not play until it is started again.</p><p>Double-click <b>Azan SIP</b> in the azan-sip folder to start it. This page will reconnect by itself.</p></div>`; }

function pageOverview(){

function renderOverviewLive(){
  if(!$("#hero")) return;
  if(offline||!S){ $("#main").innerHTML = stoppedHTML(); return; }
  const warn = [...(S.error?[S.error]:[]), ...(S.warnings||[])];
  $("#ov-banners").innerHTML = warn.map((w,i)=>`<div class="banner ${i===0&&S.error?"bad":""}">${ICON.warn}<div>${esc(w)}</div></div>`).join("");
  let hero;
  if(S.playing){
    hero = `<div class="eyebrow">Now playing</div><div class="hero-grid"><div class="playing"><div class="bars"><i></i><i></i><i></i><i></i></div><div class="big">${esc(S.playing)}</div></div>
            <button class="btn" onclick="stopAudio()">${ICON.stop} Stop now</button></div>`;
  } else if(!S.running){
    hero = `<div class="eyebrow">${S.configured===false?"Almost ready":"Paused"}</div><div class="hero-grid"><div><div class="big">${S.configured===false?"Set up, then save":"Automatic azan is off"}</div>
            <div class="when">${S.configured===false?"Check each page in the menu, then press Save changes.":"Nothing will play at prayer times."}</div></div>
            ${S.configured===false?(SESSION.box?`<button class="btn" onclick="openGuide()">Open the setup guide</button>`:""):`<button class="btn" onclick="setScheduler(true)">${ICON.play} Switch on</button>`}</div>`;
  } else if(S.next){
    const n=S.next, title=n.kind==="ramadan" ? n.label : TITLE[n.prayer]+(n.kind==="reminder"?" reminder":"");
    hero = `<div class="eyebrow">${n.kind==="ramadan"?"Next in Ramadan":"Next azan"}</div><div class="hero-grid"><div><div class="big">${esc(title)}</div><div class="when">${esc(n.time)} ${esc(n.day)}</div></div>
            <div style="text-align:right"><div class="countdown" id="countdown">${fmtDur(n.seconds)}</div><div style="opacity:.8;font-size:13px">remaining</div></div></div>`;
  } else {
    hero = `<div class="eyebrow">Next azan</div><div class="big">None scheduled</div><div class="when">Switch on at least one prayer below.</div>`;
  }
  $("#hero").innerHTML = pattern + hero + `<div class="meta">${esc(S.date||"")}${S.ramadan&&S.ramadan.day?` · Ramadan day ${S.ramadan.day}`:""} · ${esc(S.location||"")} · ${esc(S.method||"")}${S.asr==="hanafi"?" · Hanafi Asr":""}${S.skip_today?" · <b>skipped today</b>":""}</div>`;
  $("#pgrid").innerHTML = (S.today||[]).map(p=>{
    const name = p.jumuah ? "Jumu'ah" : TITLE[p.name];
    const badge = p.status==="next" ? '<span class="pill brand">Next</span>' : p.status==="played" ? '<span class="pill ok">Played</span>' : "";
    const foot = p.azan ? `<span>${p.enabled?"Azan on":"Azan off"}</span><label class="switch" title="Play the azan for ${esc(name)}"><input type="checkbox" ${p.enabled?"checked":""} onchange="togglePrayer('${p.name}',this.checked)"><span></span></label>` : `<span>No azan</span>`;
    return `<div class="pcard ${p.name==="sunrise"?"sunrise":""} ${p.status}"><div class="name">${esc(name)} ${badge}</div><div class="time">${esc(p.time)}</div><div class="foot">${foot}</div></div>`;
  }).join("");
  $("#history").innerHTML = (S.history||[]).length ? `<table>${S.history.slice(0,6).map(h=>`<tr><td>${esc(h.label)}</td><td class="muted">${esc(h.at.slice(11,16))} ${esc(h.at.slice(0,10))}</td><td>${h.ok?'<span class="pill ok">sent</span>':'<span class="pill warn">failed</span>'}</td></tr>`).join("")}</table>` : '<p class="muted">Nothing played yet since AthanBox started.</p>';
  const ol=$("#ovlog"); ol.innerHTML = logHTML((S.log||[]).slice(-8)); ol.scrollTop=ol.scrollHeight;
}

function logHTML(lines){ return lines.map(l=>`<div class="${esc(l.level)}"><span class="ts">${esc(l.t.slice(11))}</span> ${esc(l.msg)}</div>`).join("") || '<span class="muted">No messages yet.</span>'; }

function schedulePreview(delay=350){ if(page!=="times") return; clearTimeout(previewTimer); previewTimer=setTimeout(async()=>{ try{ previewData = await api("/api/preview",{config:CFG}); previewData.error=null; }catch(e){ previewData={error:e.message}; } renderPreview(); }, delay); }
function renderPreview(){

  if(!previewData){ el.innerHTML='<p class="muted">Calculating…</p>'; return; }
  if(previewData.error){ el.innerHTML=`<div class="banner bad">${ICON.warn}<div>${esc(previewData.error)}</div></div>`; return; }
  $("#tzname").textContent = previewData.timezone;
  el.innerHTML = `<table><tr><th>Date</th>${["fajr","sunrise","dhuhr","asr","maghrib","isha"].map(k=>`<th>${TITLE[k]}</th>`).join("")}</tr>${previewData.week.map(r=>`<tr><td>${esc(r.date)}</td>${["fajr","sunrise","dhuhr","asr","maghrib","isha"].map(k=>`<td ${k==="sunrise"?'class="muted"':""}>${esc(r[k])}</td>`).join("")}</tr>`).join("")}</table>`;
}
async function findCity(){
  const q=$("#city").value.trim(); if(!q) return; const box=$("#cityres"); box.innerHTML='<p class="muted">Searching…</p>';
  try{
    const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name="+encodeURIComponent(q)); const j=await r.json();

function pickCity(i){
  const c=window._cities[i];
  CFG.location.name=[c.name,c.country].filter(Boolean).join(", "); CFG.location.latitude=+c.latitude.toFixed(4); CFG.location.longitude=+c.longitude.toFixed(4);
  if(c.elevation!=null) CFG.location.elevation=Math.round(c.elevation);
  if(c.timezone && CFG.location.timezone!=="local" && (META.zones||[]).includes(c.timezone)) CFG.location.timezone=c.timezone;
  dirty(); render(); schedulePreview(0); toast("Location set to "+CFG.location.name+" - press Save to keep it.");

async function downloadTemplate(){
  await act(async()=>{
    const cfg=clone(CFG); delete cfg.calculation.timetable;
    const rows=[]; const start=new Date(); start.setMonth(0,1);
    // ask the server for the whole year using the current calculation
    const r = await api("/api/preview?days=366",{config:cfg, days:366, start:`${start.getFullYear()}-01-01`});
    rows.push("date,fajr,sunrise,dhuhr,asr,maghrib,isha");
    r.week.forEach(x=>rows.push([x.iso,x.fajr,x.sunrise,x.dhuhr,x.asr,x.maghrib,x.isha].join(",")));
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([rows.join("\r\n")+"\r\n"],{type:"text/csv"})); a.download=`timetable-${start.getFullYear()}.csv`; a.click();
  }, "Template downloaded - fill it in with your mosque's times.");
}

function audioOptions(cur, extra){
  const files = META.audio_files||[];
  let o = extra.map(([v,l])=>opt(v,l,cur)).join("");
  o += files.map(f=>opt("audio/"+f, f, cur)).join("");
  if(cur && cur!=="tone" && !extra.some(([v])=>v===cur) && !files.some(f=>"audio/"+f===cur)) o += opt(cur, cur+" (missing!)", cur);
  return o;
}

async function uploadAudio(fileList){
  const box=$("#upl");
  for(const f of fileList){
    box.innerHTML=`<p class="muted">Converting ${esc(f.name)}…</p>`;
    let body, name;
    try{ body = await toPhoneWav(f); name = f.name.replace(/\.[^.]+$/,"")+".wav"; }
    catch(e){ body = await f.arrayBuffer(); name = f.name; toast(`Couldn't convert ${f.name} in the browser - uploading as is.`,"bad"); }
    box.innerHTML=`<p class="muted">Saving ${esc(name)}…</p>`;
    try{
      const r = await api("/api/upload?kind=audio&name="+encodeURIComponent(name), body, true);
      META.audio_files = r.files;
      if(!CFG.audio.azan || CFG.audio.azan==="tone" || !(META.audio_files||[]).some(x=>"audio/"+x===CFG.audio.azan)){ CFG.audio.azan="audio/"+r.name; dirty(); toast(`Added ${r.name} and set it as the azan - press Save.`); }
      else toast(`Added ${r.name}. Choose where to use it below.`);
    }catch(e){ toast(e.message,"bad"); }
  }
  box.innerHTML=""; render();
}
async function toPhoneWav(file){
  const data = await file.arrayBuffer();
  const AC = window.AudioContext||window.webkitAudioContext; const ctx = new AC();
  const decoded = await ctx.decodeAudioData(data.slice(0)); ctx.close();
  const rate = 8000, len = Math.ceil(decoded.duration*rate);
  const off = new OfflineAudioContext(1, len, rate);
  const src = off.createBufferSource(); src.buffer = decoded;
  const hp = off.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=180;
  const comp = off.createDynamicsCompressor(); comp.threshold.value=-20; comp.ratio.value=3; comp.attack.value=0.01; comp.release.value=0.25;
  src.connect(hp); hp.connect(comp); comp.connect(off.destination); src.start();
  const out = (await off.startRendering()).getChannelData(0);
  let peak=0; for(let i=0;i<out.length;i++){ const v=Math.abs(out[i]); if(v>peak) peak=v; }
  const gain = peak>0 ? 0.89/peak : 1;
  const buf = new ArrayBuffer(44+out.length*2), v = new DataView(buf);
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+out.length*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,out.length*2,true);
  for(let i=0;i<out.length;i++){ const s=Math.max(-1,Math.min(1,out[i]*gain)); v.setInt16(44+i*2, s<0?s*32768:s*32767, true); }
  return buf;
}

function previewAudio(btn, f){
  const a = PREVIEW_AUDIO, same = a && a.dataset.f === f;
  if(a){ a.ontimeupdate = a.onended = a.onerror = null; a.pause(); a.btn.innerHTML = ICON.play; a.btn.title = "Listen here"; a.dur.textContent = ""; PREVIEW_AUDIO = null; }
  if(same) return;
  const n = new Audio("/audio/" + encodeURIComponent(f)), dur = btn.parentElement.querySelector(".dur");
  const mmss = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}` : "-:--";
  Object.assign(n, {btn, dur}); n.dataset.f = f; PREVIEW_AUDIO = n;
  n.ontimeupdate = () => { if(dur.isConnected) dur.textContent = `${mmss(n.currentTime)} / ${mmss(n.duration)}`; else n.pause(); };
  n.onended = n.onerror = () => { if(PREVIEW_AUDIO === n) previewAudio(btn, f); };
  btn.innerHTML = ICON.stop; btn.title = "Stop"; dur.textContent = "…";
  n.play().catch(() => {});
}
async function delAudio(f){ if(!confirm(`Remove ${f}?`)) return; await act(async()=>{ const r=await api("/api/delete-audio",{name:f}); META.audio_files=r.files; render(); }, "Removed"); }

// ---- Phones
const KINDS = {
  multicast:{t:"Multicast paging", d:"Recommended. Yealink, Grandstream, Fanvil, Snom, Cisco MPP. No phone system changes - each phone listens on one address.", i:ICON.broadcast},
  pbx:{t:"Phone system page group", d:"Grandstream UCM, FreePBX, 3CX and others. AthanBox signs in as an extension and calls your paging group.", i:ICON.server},
  direct:{t:"Call each phone directly", d:"For Poly/Polycom or when multicast isn't possible. Phones must allow direct IP calls and auto-answer.", i:ICON.phone},
  rtp:{t:"IP speaker (RTP)", d:"Paging speakers that listen for audio on a fixed IP address and port.", i:ICON.speaker},
  server:{t:"Register to AthanBox (SIP trunk)", d:"Your phone system adds AthanBox as a SIP trunk. AthanBox calls it for the azan, for example on the paging group. No extension needed on the phone system.", i:ICON.signin},
  phones:{t:"Desk phones sign in to AthanBox", d:"Each desk phone adds AthanBox as a line, with its own extension on AthanBox. AthanBox rings them for the azan and they answer by themselves. No phone system needed.", i:ICON.deskphone},
};
const SIPKIND = {server:"trunk", phones:"phone"};   // the two methods that share AthanBox's own SIP server
function kindOf(t){ if(t.type==="server") return "server"; if(t.type==="phones") return "phones"; if(t.type==="multicast") return "multicast"; if(t.type==="unicast_rtp") return "rtp"; if(t.mode) return t.mode; return (t.username || /sip:[^@]+@/.test(t.uri||"")) && !t.uris ? "pbx" : "direct"; }
function summary(t){
  const k=kindOf(t);
  if(k==="multicast") return `Multicast ${t.address||""} · ${t.codec||"PCMU"}`;
  if(k==="rtp") return (t.addresses||[t.address]).filter(Boolean).join(", ");
  if(k==="pbx") return `${t.uri||""}${t.username?" as extension "+t.username:""}`;
  if(k==="server"){ const a=t.accounts||[]; return `Port ${t.port||5060} · ${a.length} SIP trunk account${a.length===1?"":"s"}${a.length?": "+a.map(x=>x.name||x.username).join(", "):""}`; }
  if(k==="phones"){ const a=t.accounts||[]; return `Port ${t.port||5060} · ${a.length} desk phone${a.length===1?"":"s"}${a.length?": "+a.map(x=>x.name?`${x.name} (${x.username})`:x.username).join(", "):""}`; }
  return `${(t.uris||[t.uri]).filter(Boolean).length} phone(s): ${(t.uris||[t.uri]).filter(Boolean).map(u=>u.replace(/^sip:/,"")).join(", ")}`;
}
function toEdit(t){
  const k=kindOf(t), e={kind:k,name:t.name||"",enabled:t.enabled!==false,codec:t.codec||"PCMU"};
  const [ip,port] = String(t.address||"224.5.6.20:10008").split(":"); e.mc_ip=ip; e.mc_port=port||"10008";
  const m=/^sip:(?:([^@]+)@)?([^;>]+)/.exec(t.uri||""); e.pbx_ext=m&&m[1]||""; e.pbx_host=m&&m[2]||"";
  e.username=t.username||""; e.password=t.password||""; e.auth_username=t.auth_username||""; e.register=t.register!==false;
  e.phones=(t.uris||(k==="direct"&&t.uri?[t.uri]:[])).map(u=>u.replace(/^sip:/,"")).join("\n");
  e.rtp=(t.addresses||(t.address&&k==="rtp"?[t.address]:[])).join("\n");
  e.port=String(t.port||sipPort()); e.accounts=k==="server"?JSON.parse(JSON.stringify(t.accounts||[])).map(a=>({...a, kind:"trunk", dial:a.dial||"", max_signins:String(a.max_signins||1)})):[];
  e.desk=k==="phones"?JSON.parse(JSON.stringify(t.accounts||[])).map(a=>({name:a.name||"", username:a.username||"", password:a.password||"", max_signins:String(a.max_signins||1)})):[];
  return e;
}
function fromEdit(e){
  const base={name:e.name||KINDS[e.kind].t, enabled:e.enabled, codec:e.codec};
  const lines=s=>String(s||"").split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
  if(e.kind==="multicast"){ if(!/^(22[4-9]|23\d)\./.test(e.mc_ip)) throw new Error("A multicast address starts with 224-239, e.g. 224.5.6.20"); return {...base,type:"multicast",address:`${e.mc_ip}:${parseInt(e.mc_port)||10008}`}; }
  if(e.kind==="server"){
    const port=parseInt(e.port,10); if(!(port>=1&&port<=65535)) throw new Error("The SIP port must be a number, usually 5060");
    const accts=(e.accounts||[]).map(a=>({name:(a.name||"").trim(), username:(a.username||"").trim(), password:a.password||"", kind:"trunk", dial:(a.dial||"").trim(), max_signins:parseInt(a.max_signins,10)}));
    if(!accts.length) throw new Error("Add at least one SIP trunk account");
    const seen=new Set();
    for(const a of accts){
      if(!/^[A-Za-z0-9_.+-]{1,40}$/.test(a.username)) throw new Error("Usernames can use letters, numbers and . _ - + (no spaces)");
      if(seen.has(a.username.toLowerCase())) throw new Error(`The username ${a.username} is used twice`); seen.add(a.username.toLowerCase());
      if(a.password.length<8) throw new Error(`Use a password of at least 8 characters for ${a.username}`);
      if(!/^[A-Za-z0-9*#+_.-]{0,40}$/.test(a.dial)) throw new Error(`The number to call for ${a.username} can use digits, letters and * # + _ . -`);
      if(!(a.max_signins>=1&&a.max_signins<=50)) throw new Error(`Sign-ins allowed for ${a.username} must be between 1 and 50`);
    }
    if(CFG.targets.some((t,i)=>t.type==="server"&&i!==e.index)) throw new Error("AthanBox is already set up for phone systems to register to. Edit that entry and add accounts to it.");
    sipOthers(e, accts, port);
    return {...base, type:"server", port, accounts:accts};
  }
  if(e.kind==="phones"){
    const port=parseInt(e.port,10); if(!(port>=1&&port<=65535)) throw new Error("The SIP port must be a number, usually 5060");
    const accts=(e.desk||[]).map(a=>({name:(a.name||"").trim(), username:(a.username||"").trim(), password:a.password||"", kind:"phone", max_signins:parseInt(a.max_signins,10)||1}));
    if(!accts.length) throw new Error("Add at least one desk phone");
    const seen=new Set();
    for(const a of accts){
      if(!/^[A-Za-z0-9_.+-]{1,40}$/.test(a.username)) throw new Error("Extensions can use numbers, letters and . _ - + (no spaces)");
      if(seen.has(a.username.toLowerCase())) throw new Error(`The extension ${a.username} is used twice`); seen.add(a.username.toLowerCase());
      if(a.password.length<8) throw new Error(`Use a password of at least 8 characters for ${a.username}`);
      if(!(a.max_signins>=1&&a.max_signins<=50)) throw new Error(`Sign-ins allowed for ${a.username} must be between 1 and 50`);
    }
    if(CFG.targets.some((t,i)=>t.type==="phones"&&i!==e.index)) throw new Error("Desk phones are already set up. Edit that entry and add phones to it.");
    sipOthers(e, accts, port);
    return {...base, type:"phones", port, accounts:accts};
  }
  if(e.kind==="rtp"){ const a=lines(e.rtp); if(!a.length) throw new Error("Enter at least one speaker as IP:port"); return {...base,type:"unicast_rtp",addresses:a}; }
  if(e.kind==="pbx"){ if(!e.pbx_host||!e.pbx_ext) throw new Error("Enter the phone system address and the paging group number"); const t={...base,type:"sip",mode:"pbx",uri:`sip:${e.pbx_ext.trim()}@${e.pbx_host.trim()}`,username:e.username.trim(),password:e.password,auto_answer:false,register:e.register!==false}; if(e.auth_username.trim()) t.auth_username=e.auth_username.trim(); return t; }
  const p=lines(e.phones); if(!p.length) throw new Error("Enter at least one phone IP address"); return {...base,type:"sip",mode:"direct",uris:p.map(x=>x.startsWith("sip:")?x:"sip:"+x),auto_answer:true};
}
// Desk phones and SIP trunks sign in to the same server: one port, and each username used once
function sipPort(){ const t=CFG.targets.find(t=>SIPKIND[t.type]); return t&&t.port||5060; }
function sipOthers(e, accts, port){
  const others=CFG.targets.filter((t,i)=>SIPKIND[t.type]&&i!==e.index&&t.type!==(e.kind==="phones"?"phones":"server"));
  for(const t of others) for(const a of (t.accounts||[]))
    if(accts.some(x=>x.username.toLowerCase()===String(a.username).toLowerCase())) throw new Error(`The username ${a.username} is already used by ${t.type==="phones"?"a desk phone":"a SIP trunk"}; give each its own`);
  for(const t of others) t.port=port;   // keep both on the same port
}

function regFor(t){
  if(kindOf(t)!=="pbx" || !t.username || t.register===false || t.enabled===false) return null;
  const host=(/@([^;>]+)/.exec(t.uri||"")||[])[1]||"";
  const regs=((S&&S.registrations)||[]).filter(r=>r.extension===t.username && (r.host===host || r.host===host+":5060"));
  return regs.find(r=>r.name===(t.name||"Phone system")) || regs[0] || {status:"starting",detail:""};
}

function regPill(t){
  if(SIPKIND[kindOf(t)]){
    let info=S&&S.sipserver; if(!info) return "";   // switched off: still signed in, just not called
    if(info.status==="failed") return `<span class="pill warn" title="${esc(info.detail)}"><span class="dot"></span>Not running</span><div class="detail" style="color:var(--warn);white-space:normal">${esc(info.detail)}</div>`;
    info={...info, accounts:info.accounts.filter(a=>(a.kind||"trunk")===SIPKIND[kindOf(t)])};
    const n=info.accounts.reduce((c,a)=>c+(a.signins||[]).length,0), all=info.accounts.reduce((c,a)=>c+(a.max||1),0);
    return `<span class="pill ${n?"ok":""}" title="${esc(info.accounts.map(a=>`${a.name||a.username}: ${(a.signins||[]).length?(a.signins||[]).map(x=>x.from).join(", "):"not signed in"}`).join("\n"))}"><span class="dot"></span>${n} of ${all} signed in</span>`;
  }
  const r=regFor(t); if(!r) return "";
  if(r.status==="registered") return `<span class="pill ok" title="${esc(r.detail)}"><span class="dot"></span>Registered</span>`;
  if(r.status==="failed") return `<span class="pill warn" title="${esc(r.detail)}"><span class="dot"></span>Not registered</span><div class="detail" style="color:var(--warn);white-space:normal">${esc(r.detail)}</div>`;
  return `<span class="pill"><span class="dot"></span>Registering…</span>`;
}

function newAccount(){

  const chars="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789", buf=new Uint32Array(14); crypto.getRandomValues(buf);
  return {name:"", username:"trunk"+n, password:[...buf].map(x=>chars[x%chars.length]).join(""), kind:"trunk", dial:"", max_signins:"1"};
}
function newDeskPhone(){
  const used=new Set([...(editing&&editing.desk||[]).map(a=>String(a.username).toLowerCase()),
    ...CFG.targets.filter(t=>SIPKIND[t.type]).flatMap(t=>(t.accounts||[]).map(a=>String(a.username).toLowerCase()))]);
  let n=101; while(used.has(String(n))) n++;
  const chars="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789", buf=new Uint32Array(14); crypto.getRandomValues(buf);
  return {name:"", username:String(n), password:[...buf].map(x=>chars[x%chars.length]).join(""), max_signins:"1"};
}

// ---- Security (AthanBox): fail2ban, whitelist and blacklist. Changes apply straight away, without
// the Save bar: AthanBox's root helper picks them up within a second or two.
let SEC = null, secTick = 0, secAllBans = false;
const SEC_BANS_SHOWN = 5;   // more than this: the rest behind "Show all"
const SEC_JAILS = [["sshd","SSH sign-ins","Someone signing in to AthanBox itself over SSH, with the wrong password."],
  ["panel","Control panel","Wrong passwords on this page (http://azan.local)."],
  ["sip","SIP sign-ins","Desk phones or phone systems signing in to AthanBox with the wrong password."]];
function secSpan(s){
  s = +s; if(s < 0) return "Until it's unbanned";
  if(s === 7*86400) return "1 week";
  if(s % 86400 === 0) return s === 86400 ? "1 day" : `${s/86400} days`;
  if(s % 3600 === 0) return s === 3600 ? "1 hour" : `${s/3600} hours`;
  return `${Math.round(s/60)} minutes`;
}
async function loadSecurity(refresh){
  try{ SEC = await api("/api/security"); }catch(e){ SEC = SEC || {error:e.message}; }
  if(refresh && SEC && SEC.helper) api("/api/security/refresh", {}).then(()=>setTimeout(()=>{ if(page==="security") loadSecurity().then(secLive); }, 2500)).catch(()=>{});
}
function pageSecurity(){
  if(!SEC){ $("#main").innerHTML = '<h1>Security</h1><p class="muted">Loading…</p>'; loadSecurity(true).then(()=>{ if(page==="security") render(); }); return; }
  if(SEC.error && !SEC.settings){ $("#main").innerHTML = `<h1>Security</h1><div class="banner bad">${ICON.warn}<div>${esc(SEC.error)}</div></div>`; return; }
  const f = SEC.settings.fail2ban;
  $("#main").innerHTML = `<h1>Security</h1><p class="sub">Ban addresses that keep guessing passwords, and choose addresses that are always let in or always blocked. Changes apply straight away.</p>
  <div id="sec-status"></div>
  <div class="card"><div class="toggle-row" style="padding-top:0"><div><div class="t">Fail2ban <span id="sec-f2b-pill"></span></div>
      <div class="d">Bans an address for a while after too many wrong passwords. A banned address can't reach AthanBox at all.</div></div>
    <label class="switch"><input type="checkbox" ${f.enabled!==false?"checked":""} onchange="secF2b({enabled:this.checked})" aria-label="Fail2ban"><span></span></label></div>
    <div id="sec-jails"></div>
    <div class="grid3" style="margin-top:14px">
      <div class="field"><label>Wrong tries allowed</label><input type="number" min="1" max="100" value="${+f.maxretry||5}" onchange="secF2b({maxretry:+this.value})"></div>
      <div class="field"><label>Counted over</label><select onchange="secF2b({findtime:+this.value})">${[...new Set([...(SEC.findtimes||[]), +f.findtime])].sort((a,b)=>a-b).map(n=>opt(n, secSpan(n), f.findtime)).join("")}</select></div>
      <div class="field"><label>Ban for</label><select onchange="secF2b({bantime:+this.value})">${[...new Set([...(SEC.bantimes||[]), +f.bantime])].map(n=>opt(n, secSpan(n), f.bantime)).join("")}</select></div>
    </div>
    <div class="toggle-row"><div><div class="t">Ban repeat offenders for longer</div><div class="d">Each new ban of the same address lasts twice as long as the one before.</div></div>
      <label class="switch"><input type="checkbox" ${f.increment!==false?"checked":""} onchange="secF2b({increment:this.checked})" aria-label="Ban repeat offenders for longer"><span></span></label></div></div>
  <div class="card" id="sec-bans"></div>
  <div class="card" id="sec-wl"></div>
  <div class="card" id="sec-bl"></div>`;
  secLive(); secLists();

// the parts that change by themselves: status, jails and banned addresses

  let b = "";

  else if(!SEC.helper && SEC.system && (SEC.system.running || SEC.system.ok)) b += `<div class="banner">${ICON.warn}<div>AthanBox is setting up fail2ban and the firewall by itself. This takes a minute or two after an update.</div></div>`;
  else if(!SEC.helper && SEC.system) b += `<div class="banner bad">${ICON.warn}<div>AthanBox couldn't set up fail2ban and the firewall: ${esc(SEC.system.message)} It tries again every hour.</div></div>`;
  else if(!SEC.helper) b += `<div class="banner">${ICON.warn}<div>Fail2ban and the firewall need a one-time setup on this AthanBox. On AthanBox, in the azan-sip-box folder, run <span class="kbd">git pull</span> and then <span class="kbd">${esc(SEC.setup_command)}</span>. After that, updates set themselves up. Until then the blacklist works for the control panel and SIP only.</div></div>`;
  else if(!st) b += `<div class="banner">${ICON.warn}<div>Waiting for AthanBox to apply the settings…</div></div>`;
  for(const e of (st && st.errors) || []) b += `<div class="banner bad">${ICON.warn}<div>${esc(e)}</div></div>`;
  el.innerHTML = b;
  const pill = $("#sec-f2b-pill");
  if(pill) pill.innerHTML = SEC.pending ? '<span class="pill">Applying…</span>' : !st ? "" : !fb.installed ? '<span class="pill warn">Not installed</span>'
    : fb.running ? '<span class="pill ok">Running</span>' : f.enabled!==false ? '<span class="pill bad">Not running</span>' : '<span class="pill">Off</span>';
  const jails = (st && st.jails) || {}, on = f.enabled!==false;
  $("#sec-jails").innerHTML = SEC_JAILS.map(([k,t,d])=>{ const j = jails[k] || {};
    const p = j.unavailable ? '<span class="pill">Not available in Docker</span>' : !on || f.jails[k]===false ? "" : j.active ? `<span class="pill ${j.banned_now?"warn":"ok"}">${j.banned_now||0} banned${j.failed?` · ${j.failed} wrong tries`:""}</span>` : st && fb.running ? '<span class="pill">Waiting</span>' : "";
    return `<div class="toggle-row"><div><div class="t">${esc(t)} ${p}</div><div class="d">${esc(d)}${j.total_banned?` Banned ${j.total_banned} time${j.total_banned===1?"":"s"} since fail2ban started.`:""}</div></div>
      <label class="switch"><input type="checkbox" ${f.jails[k]!==false?"checked":""} ${on?"":"disabled"} onchange="secF2b({jails:{${k}:this.checked}})" aria-label="${esc(t)}"><span></span></label></div>`; }).join("");
  const bans = [];
  for(const [k,t] of SEC_JAILS) for(const x of ((jails[k]||{}).banned||[])) bans.push({...x, jail:t});
  const byWhy = {}; for(const x of bans) byWhy[x.jail] = (byWhy[x.jail]||0) + 1;
  const shown = secAllBans ? bans : bans.slice(0, SEC_BANS_SHOWN);
  const until = u => !u ? "" : u.startsWith("9999") ? "until unbanned" : "until " + u.slice(0,16).replace("T"," ");
  $("#sec-bans").innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Banned right now${bans.length?` <span class="pill warn">${bans.length}</span>`:""}</h2>${st&&st.updated?`<span class="muted" style="font-size:13px">Checked ${esc(st.updated.slice(11,16))}</span>`:""}</div>
    ${bans.length ? `<p class="muted" style="margin:4px 0 0;font-size:13px">${Object.entries(byWhy).map(([k,n])=>`${n} from ${esc(k)}`).join(" · ")}</p>
      <table class="tight" style="margin-top:6px">${shown.map(x=>`<tr><td class="mono">${esc(x.ip)}</td><td class="muted">${esc(x.jail)}${x.until?" · "+esc(until(x.until)):""}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn tiny" onclick="secUnban('${esc(x.ip)}')">Unban</button> <button class="btn tiny danger" title="Always block" onclick="secBlockBanned('${esc(x.ip)}')">Block</button></td></tr>`).join("")}</table>
      ${bans.length > SEC_BANS_SHOWN ? `<button class="btn tiny" style="margin-top:8px" onclick="secAllBans=!secAllBans;secLive()">${secAllBans ? "Show fewer" : `Show all ${bans.length}`}</button>` : ""}`
      : `<p class="muted" style="margin:8px 0 0">${!on ? "Fail2ban is off." : fb && fb.running ? "Nobody is banned." : "Nothing to show until fail2ban is running."}</p>`}`;
}
function secRows(which){
  const L = SEC.settings[which];
  const fixed = which==="whitelist" ? `<div class="tvrow"><div style="flex:1;min-width:0"><div class="t mono">127.0.0.1 · ::1</div><div class="d">Localhost: AthanBox itself. Always allowed.</div></div></div>` : "";

function secLists(){

    ${secRows("whitelist")}${secAddForm("wl", inWl ? "" : you)}`;
  $("#sec-bl").innerHTML = `<h2>Blacklist</h2><p class="muted" style="margin-top:-6px">Addresses that are always blocked: they can't reach AthanBox at all${SEC.helper?"":" (until fail2ban is set up: the control panel and SIP only)"}. The whitelist wins if an address is on both.</p>

function secAddForm(k, mine){
  return `<div class="grid3" style="margin-top:14px;align-items:end">
    <div class="field" style="margin:0"><label>IP address or range</label><input type="text" id="sec-${k}-ip" placeholder="${k==="wl"?"192.168.1.0/24":"203.0.113.7"}" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')secAdd('${k}')"></div>
    <div class="field" style="margin:0"><label>Note (optional)</label><input type="text" id="sec-${k}-note" maxlength="80" placeholder="${k==="wl"?"Grandstream UCM":"Kept guessing passwords"}" onkeydown="if(event.key==='Enter')secAdd('${k}')"></div>
    <div class="row"><button class="btn primary" onclick="secAdd('${k}')">${k==="wl"?"Add to whitelist":"Block"}</button>${mine?`<button class="btn small" onclick="secAdd('wl','${esc(mine)}','My device')">Add my address</button>`:""}</div></div>
    <div class="hint" style="margin-top:8px">One address, such as 203.0.113.7, or a range, such as 203.0.113.0/24. IPv6 works too.</div>`;
}
async function secF2b(change){
  await act(async()=>{ SEC = await api("/api/security/fail2ban", change); secLive(); secSoon(); }, "Saved");
}
async function secAdd(k, ip, note){
  const which = k==="wl" ? "whitelist" : "blacklist";
  ip = ip ?? $(`#sec-${k}-ip`).value; note = note ?? $(`#sec-${k}-note`).value;
  await act(async()=>{ SEC = await api("/api/security/add", {list:which, ip, note}); secLists(); secLive(); secSoon(); },
    which==="whitelist" ? "Added to the whitelist" : "Blocked");
}
async function secRemove(which, ip, mine){
  if(mine && !confirm(`You're connected from inside ${ip}. Without it on the whitelist, fail2ban can ban this device after too many wrong passwords. Remove it anyway?`)) return;
  await act(async()=>{ SEC = await api("/api/security/remove", {list:which, ip}); secLists(); secLive(); secSoon(); }, `Removed from the ${which}`);
}
async function secUnban(ip){ await act(async()=>{ await api("/api/security/unban", {ip}); secSoon(); }, `Unbanning ${ip}…`); }
async function secBlockBanned(ip){
  if(!confirm(`Block ${ip} for good? It goes on the blacklist and stays blocked after its ban runs out.`)) return;
  await secAdd("bl", ip, "Banned by fail2ban");
}
// refresh a few times while AthanBox applies a change
function secSoon(){ [1200, 3000, 6000].forEach(ms=>setTimeout(()=>{ if(page==="security") loadSecurity().then(secLive); }, ms)); }

function rset(){ return Object.assign({}, RDEF, CFG.ramadan || {}); }
function addDays(iso, n){ const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function longDay(iso){ return iso ? new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long", year:"numeric", timeZone:"UTC"}) : ""; }
function rStart(R){   // the first day in use: the one set here, unless that Ramadan is over; else the expected date
  const sr = S && S.ramadan, today = sr ? sr.today : new Date().toISOString().slice(0, 10);
  if(R.start && addDays(R.start, +R.days) >= today) return {start:R.start, expected:false};
  return {start: sr ? sr.expected_start : "", expected:true};
}
function shiftStart(n){ const R = rset(); CFG.ramadan.start = addDays(rStart(R).start, n); dirty(); render(); }
function soundOpts(cur, tone=true, none=null){
  const files = (META.audio_files || []).map(f => "audio/" + f);
  let o = (none !== null ? opt("", none, cur) : "") + (tone ? opt("tone", "Chime", cur) : "");
  o += files.map(f => opt(f, f.slice(6), cur)).join("");
  if(cur && cur !== "tone" && !files.includes(cur)) o += opt(cur, cur.replace(/^audio\//, "") + " (missing)", cur);
  return o;
}
function testSound(v, label){
  if(!v) return toast("Choose a recording first", "bad");
  test(v === "tone" ? {source:"tone", label} : {source:"file:" + v.replace(/^audio\//, ""), seconds:"default", label});
}

  const t0 = Date.now(); let sawDown = false;
  while(Date.now()-t0 < 120000){
    await new Promise(r=>setTimeout(r,1000));
    try{ const p = await fetch("/api/ping",{cache:"no-store"}); if(p.ok && sawDown){ location.reload(); return; } if(!p.ok) sawDown=true; }
    catch(e){ sawDown = true; }
  }
  $("#ov-title").textContent="This is taking longer than expected"; $("#ov-text").innerHTML = SESSION.docker ? "Refresh this page in a minute. If it still doesn't open, run <b>docker compose up -d</b> on the computer running AthanBox."
    : SESSION.box ? "Refresh this page in a minute. If it still doesn't open, switch AthanBox off and on again."
    : "Start AthanBox again, then refresh this page.";
}

async function quitApp(){
  if(!confirm("Quit AthanBox? The azan will not play until you start it again.")) return;
  try{ await api("/api/quit",{}); }catch(e){}
  offline=true; S=null; renderMini(); $("#main").innerHTML = stoppedHTML();
}

// ---------------------------------------------------------------- start
window.addEventListener("beforeunload", e=>{ if(isDirty()){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("hashchange", ()=>{ const p=location.hash.slice(1); if(p&&p!==page){ page=p; editing=null; render(); if(p==="times") schedulePreview(0); } });
(async function init(){
  render();
  await loadSession();
  await poll();
  for(let i=0;i<100 && !CFG;i++){ try{ await loadConfig(); }catch(e){ await new Promise(r=>setTimeout(r,2000)); } }
  render(); if(page==="times") schedulePreview(0);
  setInterval(async()=>{ if(offline) return; if(!CFG){ try{ await loadConfig(); render(); }catch(e){} } }, 3000);
})();
// reconnect: when the service comes back after being stopped, reload settings
setInterval(async()=>{ if(offline){ try{ await api("/api/ping"); offline=false; await loadConfig(); await poll(); render(); }catch(e){} } }, 3000);
</script>
