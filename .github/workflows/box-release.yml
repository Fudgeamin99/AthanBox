# Publishes a GitHub Release for each Azan SIP Box version.
# - The version, title and notes come from the newest "## x.y.z - title" section of BOX_CHANGELOG.md,
#   so adding a section there and merging it to main is all it takes. Releases are tagged box-vX.Y.Z.
# - The desktop app's CHANGELOG.md and version (azan_sip/__init__.py) are ignored here, so merging
#   app updates into this repository never publishes anything. The app's own release workflow
#   (with the Windows AzanSIP.exe build) lives only in Fudgeamin99/ATHAN-TO-SIP.
# - Each new release also publishes the Docker image (see compose.yaml).
# - The Android TV app (AzanTV.apk) is the desktop app's, built in Fudgeamin99/ATHAN-TO-SIP: each new
#   release attaches a copy of its newest one, and the Docker image carries it.
# - The Wyse client (client/, the TV screen for a Dell Wyse) is attached as azan-sip-client.deb,
#   with a copy named after its own version.
# - To release from a branch before it's merged, push it as a new branch named release/<anything>
#   (or push the tag box-vX.Y.Z on it). Its newest BOX_CHANGELOG.md version is published.
name: Box release

on:
  push:
    branches: [main]
    paths: [BOX_CHANGELOG.md]     # (not checked for tag pushes)
    tags: ["box-v*"]
  create:                         # a new release/... branch (the job skips any other branch or tag)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.publish.outputs.created }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish the newest Box version
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          heading=$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+( |$)' BOX_CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "No version in BOX_CHANGELOG.md yet - nothing to publish"
            exit 0
          fi
          title="${heading#\#\# }"        # "0.1.0 - Control panel on the network"
          v="${title%% *}"                # "0.1.0"
          tag="box-v$v"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match the newest version in BOX_CHANGELOG.md ($v)"
            exit 1
          fi
          if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          # Never publish an older version after a newer one, e.g. merging 0.1.0 to main after
          # 0.2.0 was released from its branch.
          newest=$(git ls-remote --tags origin 'box-v*' | sed -n 's|.*refs/tags/box-v\([0-9.]*\)$|\1|p' \
                   | sort -V | tail -n 1)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$v" "$newest" | sort -V | tail -n 1)" != "$v" ]; then
            echo "box-v$newest is already out, so $v isn't published"
            exit 0
          fi
          awk -v v="$v" '
            $0 ~ "^## " v "( |$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' BOX_CHANGELOG.md > notes.md
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            where=(--verify-tag)                  # the tag pushed by hand
          else
            where=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" -R "$REPO" "${where[@]}" --title "$title" \
            --notes-file notes.md --latest
          echo "Released $tag"
          if gh release download -R Fudgeamin99/ATHAN-TO-SIP -p AzanTV.apk -D apk; then
            gh release upload "$tag" apk/AzanTV.apk -R "$REPO"
            echo "Attached the Android app (AzanTV.apk)"
          else
            echo "::warning::Couldn't fetch AzanTV.apk from Fudgeamin99/ATHAN-TO-SIP"
          fi
          sh client/build-deb.sh
          gh release upload "$tag" client/dist/azan-sip-client.deb client/dist/azan-sip-client_*_all.deb -R "$REPO"
          echo "Attached the Wyse client (azan-sip-client.deb)"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # The Docker image for each new Box release: ghcr.io/<owner>/azan-sip-box:<version> and :latest,
  # for 64-bit PCs and for ARM boards such as the Raspberry Pi.
  image:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The Android TV app, so screens on a network without internet can download it from the box.
      # Without it, /apk sends them to the app's latest release on GitHub.
      - name: Add the Android app (AzanTV.apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R Fudgeamin99/ATHAN-TO-SIP -p AzanTV.apk -D azan_sip/static
             || echo "::warning::Couldn't fetch AzanTV.apk - /apk will send screens to GitHub"

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # must be lower case

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.release.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
