# Publishes a GitHub Release for each version of AthanBox Client (the TV screen for a Dell Wyse or
# a laptop, in client/), apart from AthanBox's releases: a client-only change never makes a new AthanBox
# version or Docker image.
# - The version, title and notes come from the newest "## x.y.z - title" section of
#   client/CHANGELOG.md, which must match __version__ in client/azan_client.py. Adding a section there
#   and merging it to main is all it takes. Releases are tagged client-vX.Y.Z.
# - The package is attached as azan-sip-client.deb (for the README's install link) and as
#   azan-sip-client_X.Y.Z_all.deb (the one Update now installs).
# - A client release is never marked as the repository's latest release: that stays AthanBox's, which
#   AthanBox's own updates follow.
# - Client 0.3.0 looks in AthanBox's latest release instead: while that still carries a client package
#   (AthanBox 0.7.2 did), it's swapped for the new one, so 0.3.0 screens can update from their button.
name: Client release

on:
  push:
    branches: [main]
    paths: [client/CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: python3 -m unittest discover -s client

      - name: Publish the newest client version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          heading=$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+( |$)' client/CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "No version in client/CHANGELOG.md yet - nothing to publish"
            exit 0
          fi
          title="${heading#\#\# }"        # "0.3.1 - The client gets its own releases"
          v="${title%% *}"                # "0.3.1"
          tag="client-v$v"
          have=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' client/azan_client.py)
          if [ "$have" != "$v" ]; then
            echo "::error::client/CHANGELOG.md's newest version is $v, but __version__ in client/azan_client.py is $have"
            exit 1
          fi
          if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          # Never publish an older version after a newer one
          newest=$(git ls-remote --tags origin 'client-v*' | sed -n 's|.*refs/tags/client-v\([0-9.]*\)$|\1|p' \
                   | sort -V | tail -n 1)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$v" "$newest" | sort -V | tail -n 1)" != "$v" ]; then
            echo "client-v$newest is already out, so $v isn't published"
            exit 0
          fi
          awk -v v="$v" '
            $0 ~ "^## " v "( |$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' client/CHANGELOG.md > notes.md
          sh client/build-deb.sh
          gh release create "$tag" -R "$REPO" --target "$GITHUB_SHA" --title "AthanBox Client $title" \
            --notes-file notes.md --latest=false \
            client/dist/azan-sip-client.deb "client/dist/azan-sip-client_${v}_all.deb"
          echo "Released $tag"
          # Client 0.3.0 looks for updates in AthanBox's latest release, which carried the client up to
          # AthanBox 0.7.2. While that release still has a client package, swap it for this one, so screens
          # on 0.3.0 update from their Update button too (and from then on follow these releases).
          box=$(gh release view -R "$REPO" --json tagName -q .tagName)
          case "$box" in box-v*) ;; *) box= ;; esac
          old=$([ -n "$box" ] && gh release view "$box" -R "$REPO" --json assets -q '.assets[].name' \
                | grep -E '^azan-sip-client(_.*_all)?\.deb$' || true)
          if [ -n "$old" ]; then
            for a in $old; do gh release delete-asset "$box" "$a" -R "$REPO" -y; done
            gh release upload "$box" client/dist/azan-sip-client.deb "client/dist/azan-sip-client_${v}_all.deb" -R "$REPO"
            echo "Put $tag's package in $box too, for screens with client 0.3.0"
          fi
          grep -q "releases/download/$tag/" README.md \
            || echo "::warning::The install link in README.md isn't $tag's yet"
