# Temporary: the sample rate Chromium plays Makkah live and the Test chime at on the Wyse client
# (removed again after).
name: Makkah live probe
on:
  push:
    branches: [claude/project-thread-dtkbi3]
    paths: [.github/workflows/live-probe.yml, client/probe/**]
jobs:
  live-sound:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: A logger of each sound stream's format
        run: gcc -shared -fPIC -O2 -o rate.so client/probe/rate.c -ldl
      - name: Makkah live's sound on the Wyse client
        run: |
          mkdir -p live-sound
          docker run --rm --shm-size=1g -e RATE_SO=/src/rate.so -v "$PWD:/src" -v "$PWD/live-sound:/tmp/live-sound" \
            -w /src debian:trixie sh client/probe/live-rate.sh
