# Temporary: Makkah live's sound on the Wyse client, with Debian 13's Chromium (removed again after).
name: Makkah live probe
on:
  push:
    branches: [claude/project-thread-dtkbi3]
    paths: [.github/workflows/live-probe.yml, client/test-live-sound.sh]
jobs:
  live-sound:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        debian: [trixie]
    steps:
      - uses: actions/checkout@v4
      - name: Makkah live's sound on the Wyse client
        run: |
          mkdir -p live-sound
          docker run --rm --shm-size=1g -v "$PWD:/src" -v "$PWD/live-sound:/tmp/live-sound" \
            -w /src debian:${{ matrix.debian }} sh client/test-live-sound.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-sound-${{ matrix.debian }}
          path: live-sound/
