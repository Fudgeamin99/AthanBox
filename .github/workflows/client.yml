# AthanBox Client (client/), the TV screen for a Dell Wyse: on each pull request that changes it,
# runs its tests, builds the Debian package and installs it on Debian 12 and 13 (64-bit) and on
# 32-bit Debian 12 (an old 32-bit laptop), so a missing dependency or a broken install script is
# caught before an AthanBox release attaches it. Each one then runs the screen itself with two screens
# (client/test-two-screens.sh): cage, Chromium and a real Box, checking both show the prayer times,
# and updates itself to a newer version the way Update now does (client/test-update.sh).
name: Wyse client

on:
  pull_request:
    paths: ["client/**", .github/workflows/client.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s client -v
      - name: Build the package
        run: sh client/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: azan-sip-client
          path: client/dist/azan-sip-client_*_all.deb

  install:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian: [bookworm, trixie]
    container:
      image: debian:${{ matrix.debian }}
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - name: Install it as a Wyse would
        run: |
          set -eu
          apt-get update
          sh client/build-deb.sh
          apt-get install -y ./client/dist/azan-sip-client.deb
          azan-sip-client --version
          id azan-client
          test -x /usr/lib/azan-sip-client/kiosk
          test -f /lib/systemd/system/azan-sip-client-screen.service
          test -f /lib/systemd/system/azan-sip-client-update.path
          test -f /lib/systemd/system/azan-sip-client-shutdown.path
          python3 -m unittest discover -s client -v
      - name: Two screens show the prayer times
        run: sh client/test-two-screens.sh
      - name: Update now installs a newer client
        run: sh client/test-update.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-screens-${{ matrix.debian }}
          path: /tmp/two-screens/

  # 32-bit PCs and laptops: Debian 12 is the last version with a 32-bit installer. JavaScript
  # actions can't run in a 32-bit container, so this one runs it by hand.
  install-32bit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install it on 32-bit Debian 12
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src debian:bookworm sh -euc '
            test "$(dpkg --print-architecture)" = i386
            apt-get update
            sh client/build-deb.sh
            apt-get install -y ./client/dist/azan-sip-client.deb
            azan-sip-client --version
            dpkg-query -W -f "\${Package} \${Version} \${Architecture}\n" chromium cage seatd python3
            id azan-client
            python3 -m unittest discover -s client -v'
      - name: Two screens and Update now, on 32-bit Debian 12
        run: |
          mkdir -p two-screens
          docker run --rm --platform linux/386 --shm-size=1g -v "$PWD:/src" -v "$PWD/two-screens:/tmp/two-screens" \
            -w /src debian:bookworm sh -euc 'apt-get update && sh client/test-two-screens.sh && sh client/test-update.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-screens-32bit
          path: two-screens/
