# Publishes a GitHub Release for every version.
# - Each version in azan_sip/__init__.py is tagged at the first commit on main where it appeared,
#   so bumping __version__ and pushing is all it takes to publish a release.
# - Any v* tag without a release gets one (this also back-fills older versions).
# Release notes come from the matching "## x.y.z" section of CHANGELOG.md.
# A Windows job then builds AzanSIP.exe, starts it to check it works, and attaches it to the release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes_for() {  # $1 = version without the v
            awk -v v="$1" '
              $0 ~ "^## " v "( |$)" {found=1; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md > notes.md
            {
              echo
              echo "### Install on Windows"
              echo "1. Download **AzanSIP.exe** below. It appears a few minutes after the release is published, once it has been built and tested."
              echo "2. Put it in a folder of its own, for example \`C:\\AzanSIP\`. Your settings and recordings are kept in that folder."
              echo "3. Double-click **AzanSIP.exe**. The control panel opens in your browser. No Python is needed."
              echo
              echo "To run from source instead, install Python 3.11 or newer, download **Source code (zip)**, and double-click **Azan SIP**."
              echo
              echo "### Already installed?"
              echo "In the control panel, go to **Settings → Updates** and press **Check for updates**, then **Update now**. Your settings, recordings and timetable are kept."
            } >> notes.md
          }

          title_for() {  # "1.2.0 - Stays registered on the phone system"
            t=$(grep -m1 "^## $1\( \|$\)" CHANGELOG.md | sed "s/^## //" || true); echo "${t:-$1}"
          }

          # 1) Tag every version: the first commit on main where each __version__ appeared
          declare -A seen
          for sha in $(git rev-list --reverse HEAD); do
            v=$(git show "$sha:azan_sip/__init__.py" 2>/dev/null | sed -n 's/^__version__ = "\(.*\)"/\1/p' || true)
            if [ -z "$v" ] || [ -n "${seen[$v]:-}" ]; then continue; fi
            seen[$v]=$sha
            if ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              git tag "v$v" "$sha"
              git push origin "v$v"
              echo "Tagged v$v at ${sha:0:7}"
            fi
          done

          # 2) Make sure every v* tag has a release (oldest first, newest marked latest)
          latest=$(git tag -l 'v*' --sort=v:refname | tail -n1)
          for tag in $(git tag -l 'v*' --sort=v:refname); do
            if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              continue
            fi
            v="${tag#v}"
            notes_for "$v"
            flag="--latest=false"
            [ "$tag" = "$latest" ] && flag="--latest"
            gh release create "$tag" -R "$REPO" --verify-tag --title "$(title_for "$v")" \
              --notes-file notes.md $flag
            echo "Released $tag"
          done

  exe:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Does this version still need AzanSIP.exe?
        id: need
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' azan_sip/__init__.py | tr -d '\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx 'AzanSIP.exe'; then
            echo "AzanSIP.exe is already attached to v$v"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.need.outputs.build == 'true'
        with:
          python-version: "3.12"

      - name: Build AzanSIP.exe
        if: steps.need.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10" tzdata
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name AzanSIP `
            --icon packaging/azan.ico --paths . `
            --add-data "azan_sip/static;azan_sip/static" `
            --collect-data tzdata --hidden-import tzdata `
            packaging/azan_sip_app.py
          Get-Item dist/AzanSIP.exe | Format-List Name, Length

      - name: Test AzanSIP.exe
        if: steps.need.outputs.build == 'true'
        env:
          EXPECTED: ${{ steps.need.outputs.version }}
        run: |
          $p = Start-Process -FilePath dist\AzanSIP.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

          Start-Process -FilePath dist\AzanSIP.exe -ArgumentList "--background"
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod -Uri http://127.0.0.1:8765/api/ping -TimeoutSec 2; if ($r.app -eq "azan-sip") { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Get-Content dist\azan.log -ErrorAction SilentlyContinue; throw "AzanSIP.exe did not start" }

          $state = Invoke-RestMethod -Uri http://127.0.0.1:8765/api/state
          if ($state.version -ne $env:EXPECTED) { throw "Started version $($state.version), expected $env:EXPECTED" }
          $page = Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing
          if ($page.Content -notmatch "<title>Azan SIP</title>") { throw "Control panel page is missing" }
          $upd = Invoke-RestMethod -Uri http://127.0.0.1:8765/api/update
          if ($upd.mode -ne "exe") { throw "Expected exe update mode, got $($upd.mode)" }
          $cfg = Invoke-RestMethod -Uri http://127.0.0.1:8765/api/config
          if ($cfg.meta.zones.Count -lt 100) { throw "Time zone list is missing (tzdata not bundled)" }
          Write-Host "AzanSIP.exe $($state.version) started; control panel, updater and time zones OK"

          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/quit -Headers @{ "X-Azan-Panel" = "1" } -ContentType "application/json" -Body "{}" | Out-Null
          Start-Sleep -Seconds 4
          if (-not (Test-Path dist\config.toml)) { throw "config.toml was not created next to the exe" }
          Get-Content dist\azan.log

      - name: Attach AzanSIP.exe to the release
        if: steps.need.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ steps.need.outputs.tag }}" dist/AzanSIP.exe --clobber -R "$REPO"
          echo "Attached AzanSIP.exe to ${{ steps.need.outputs.tag }}"
